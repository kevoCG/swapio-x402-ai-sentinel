<!DOCTYPE html>
<html>
<head><title>Transfer</title></head>
<body>
<h3>Transferring video...</h3>
<script>
async function run() {
  const res = await fetch('/swapio_x402_pitch.mp4');
  const buffer = await res.arrayBuffer();
  if (window.opener) {
    window.opener.postMessage({ type: 'VIDEO_BLOB', buffer: buffer }, '*', [buffer]);
  }
}
run();
</script>
</body>
</html>
